services:
  web:
    build: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4
    volumes:
      - app_data:/data
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL for production volume path
      - DATABASE_URL=sqlite:////data/db.sqlite3
    restart: always
    networks:
      - frontend

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro
      - app_data:/data:ro
    ports:
      - "8010:80"
      - "443:443"
    depends_on:
      - web
    restart: always
    networks:
      - frontend

networks:
  frontend:

volumes:
  app_data:
  static_data: