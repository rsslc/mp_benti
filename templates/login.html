{% extends "base.html" %}
{% load static %}
{% block title %}Login — Generi Alimentari{% endblock %}
{% block content %}
<div class="max-w-xs mx-auto mt-20">
  <div class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm">
    <h1 class="text-lg font-semibold mb-4 text-center">Customer Login</h1>
    <form method="post" class="space-y-3">
      {% csrf_token %}
      <div>
        <label for="id_username" class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" name="username" id="id_username" class="mt-1 block w-full rounded-md border border-gray-300 bg-gray-50 px-3 py-2 text-sm focus:ring-gray-900 focus:border-gray-900" required>
      </div>
      <div>
        <label for="id_password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" name="password" id="id_password" class="mt-1 block w-full rounded-md border border-gray-300 bg-gray-50 px-3 py-2 text-sm focus:ring-gray-900 focus:border-gray-900" required>
      </div>
      <button type="submit" class="mt-2 mb-2 px-4 py-2 border rounded bg-gray-100 text-gray-800 hover:bg-gray-200">Login</button>
    </form>
    <p class="mt-3 text-xs text-gray-600 text-center">
      Forgotten your password? Contact Paolo for assistance.
    </p>
  </div>
</div>
{% endblock %}
